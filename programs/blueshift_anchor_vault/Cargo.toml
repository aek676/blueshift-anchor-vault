[package]
name = "blueshift_anchor_vault"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "blueshift_anchor_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.2.1"

[dev-dependencies]
# litesvm 0.10 (what `anchor init` 1.2.1 ships) can't load SBPFv3 programs; 0.15 can, but
# only with the dependency graph pinned in Cargo.lock. Keep Cargo.lock committed and avoid
# a blanket `cargo update`.
litesvm = "=0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
